<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分類書籤管理器 - 無障礙網頁展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 淺黃色系主題 (調整對比度以符合 WCAG AA) */
            --theme-primary: #854d0e;     /* 黃褐色，用於主要按鈕與文字，確保白字對比度 */
            --theme-primary-hover: #713f12;
            --theme-bg-light: #fefce8;    /* 極淺黃色背景 */
            --theme-bg-header: #fef08a;   /* 淺黃色 Header 背景 */
            --theme-header-text: #422006; /* 深棕色文字，確保在黃色背景上的對比度 */
            --sidebar-bg: #fef9c3;        /* 側邊欄淺黃色背景 */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #fcfcfc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 實作 WCAG 2.4.1 區塊可跳過 */
        .skip-link {
            position: absolute;
            top: -50px;
            left: 10px;
            background-color: var(--theme-primary);
            color: #ffffff;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 1000;
            transition: top 0.2s ease-in-out;
            text-decoration: none;
        }
        .skip-link:focus {
            top: 10px;
            outline: 3px solid #000;
            outline-offset: 2px;
        }

        /* 自訂無障礙焦點樣式 (WCAG 2.4.7) */
        *:focus-visible {
            outline: 3px solid var(--theme-primary);
            outline-offset: 2px;
            border-radius: 4px;
        }
        *:focus {
            outline: none;
        }

        /* 主題套用類別 */
        .theme-bg-header { background-color: var(--theme-bg-header); color: var(--theme-header-text); }
        .theme-text { color: var(--theme-primary); }
        .theme-border { border-color: var(--theme-primary); }
        .theme-btn { 
            background-color: var(--theme-primary); 
            color: white;
            transition: background-color 0.2s;
        }
        .theme-btn:hover { background-color: var(--theme-primary-hover); }
        .theme-bg-light { background-color: var(--theme-bg-light); }
        
        /* Modal 隱藏與顯示動畫 */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        /* 側邊欄樣式 */
        .category-item.active {
            background-color: var(--theme-primary);
            color: white;
            font-weight: 600;
        }
        .category-item:not(.active):hover {
            background-color: #fef08a; /* 淺黃色 hover 效果 */
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">跳至主要內容</a>

    <header class="theme-bg-header shadow-md transition-colors duration-500" role="banner">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <svg aria-hidden="true" class="h-8 w-8 text-yellow-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                </svg>
                <h1 class="text-2xl font-bold tracking-tight">分類書籤管理器</h1>
            </div>
            
            <div class="flex items-center gap-3" role="group" aria-label="資料管理選項">
                <span id="category-indicator" class="mr-4 text-sm font-medium bg-black/5 px-3 py-1 rounded-full" aria-live="polite">載入中...</span>
                
                <input type="file" id="import-file" class="hidden" accept=".json" aria-hidden="true">
                <button onclick="document.getElementById('import-file').click()" class="px-4 py-2 bg-white text-gray-800 rounded-md text-sm font-medium hover:bg-gray-50 shadow-sm border border-gray-200 transition-colors focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-yellow-100" aria-label="匯入書籤設定檔">
                    匯入
                </button>
                <button onclick="exportBookmarks()" class="px-4 py-2 bg-gray-800 text-white rounded-md text-sm font-medium hover:bg-gray-900 shadow-sm transition-colors focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-yellow-100" aria-label="匯出書籤設定檔">
                    匯出
                </button>
            </div>
        </div>
    </header>

    <div class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full">
        
        <!-- 側邊欄：目錄分類 -->
        <aside class="w-full md:w-64 md:flex-shrink-0 bg-[var(--sidebar-bg)] border-r border-yellow-200" aria-label="書籤分類目錄">
            <div class="p-4 md:p-6 sticky top-0">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-900">目錄分類</h2>
                    <button onclick="openCategoryModal()" class="text-yellow-700 hover:text-yellow-900 focus-visible:ring-2 rounded-full p-1" aria-label="新增分類">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    </button>
                </div>
                <nav>
                    <ul id="category-list" class="space-y-1">
                        <!-- 分類列表動態生成 -->
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- 主要內容：書籤列表 -->
        <main id="main-content" class="flex-grow p-4 md:p-8 w-full" role="main">
            
            <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                <h2 id="current-category-title" class="text-2xl font-semibold text-gray-800">全部書籤</h2>
                <div class="flex gap-2">
                    <button onclick="openFormModal()" class="theme-btn px-5 py-2.5 rounded-md shadow-sm font-medium flex items-center gap-2 focus-visible:ring-2 focus-visible:ring-offset-2" aria-label="新增新的書籤">
                        <svg aria-hidden="true" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        新增書籤
                    </button>
                </div>
            </div>

            <!-- 狀態與書籤列表區塊 -->
            <div id="empty-state" class="hidden text-center py-16 px-4 theme-bg-light rounded-xl border-2 border-dashed border-yellow-300">
                <svg aria-hidden="true" class="mx-auto h-12 w-12 text-yellow-600 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                <h3 class="mt-2 text-lg font-medium text-gray-900">目前分類沒有書籤</h3>
                <p class="mt-1 text-gray-600">點擊「新增書籤」按鈕開始您的收藏。</p>
            </div>

            <ul id="bookmark-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" aria-label="書籤列表">
                <!-- 書籤項目將透過 JavaScript 動態生成 -->
            </ul>
        </main>
    </div>

    <!-- 新增/編輯 書籤表單 Modal -->
    <div id="form-modal" class="modal-overlay fixed inset-0 bg-gray-900/60 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="form-modal-title">
        <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-yellow-50">
                <h3 id="form-modal-title" class="text-lg font-bold text-gray-900">新增書籤</h3>
                <button onclick="closeFormModal()" class="text-gray-500 hover:text-gray-800 focus-visible:ring-2 focus-visible:ring-yellow-700 rounded-md p-1" aria-label="關閉對話方塊">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form id="bookmark-form" class="px-6 py-5">
                <input type="hidden" id="bookmark-id">
                <div class="mb-4">
                    <label for="bookmark-title" class="block text-sm font-medium text-gray-700 mb-1">網站名稱 <span class="text-red-600" aria-hidden="true">*</span></label>
                    <input type="text" id="bookmark-title" required aria-required="true" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-600 focus:border-transparent text-gray-900" placeholder="例如：Google">
                </div>
                <div class="mb-4">
                    <label for="bookmark-url" class="block text-sm font-medium text-gray-700 mb-1">網址 (URL) <span class="text-red-600" aria-hidden="true">*</span></label>
                    <input type="url" id="bookmark-url" required aria-required="true" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-600 focus:border-transparent text-gray-900" placeholder="例如：https://www.google.com">
                </div>
                <div class="mb-5">
                    <label for="bookmark-category" class="block text-sm font-medium text-gray-700 mb-1">所屬分類</label>
                    <select id="bookmark-category" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-600 focus:border-transparent text-gray-900">
                        <!-- 選項動態生成 -->
                    </select>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeFormModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus-visible:ring-2 focus-visible:ring-gray-900">取消</button>
                    <button type="submit" class="theme-btn px-4 py-2 rounded-md focus-visible:ring-2 focus-visible:ring-offset-2">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 新增分類 Modal -->
    <div id="category-modal" class="modal-overlay fixed inset-0 bg-gray-900/60 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
        <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-yellow-50">
                <h3 id="category-modal-title" class="text-lg font-bold text-gray-900">新增分類</h3>
                <button onclick="closeCategoryModal()" class="text-gray-500 hover:text-gray-800 focus-visible:ring-2 focus-visible:ring-yellow-700 rounded-md p-1" aria-label="關閉對話方塊">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form id="category-form" class="px-6 py-5">
                <div class="mb-5">
                    <label for="new-category-name" class="block text-sm font-medium text-gray-700 mb-1">分類名稱 <span class="text-red-600" aria-hidden="true">*</span></label>
                    <input type="text" id="new-category-name" required aria-required="true" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-600 focus:border-transparent text-gray-900" placeholder="例如：工作、學習">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeCategoryModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus-visible:ring-2 focus-visible:ring-gray-900">取消</button>
                    <button type="submit" class="theme-btn px-4 py-2 rounded-md focus-visible:ring-2 focus-visible:ring-offset-2">新增</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 確認刪除 Modal -->
    <div id="confirm-modal" class="modal-overlay fixed inset-0 bg-gray-900/60 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-sm overflow-hidden">
            <div class="px-6 py-5">
                <div class="flex items-center gap-3 mb-4 text-red-600">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    <h3 id="confirm-modal-title" class="text-lg font-bold text-gray-900">確認刪除</h3>
                </div>
                <p id="confirm-modal-desc" class="text-gray-700 text-sm mb-5">您確定要刪除嗎？此動作無法復原。</p>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeConfirmModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus-visible:ring-2 focus-visible:ring-gray-900">取消</button>
                    <button type="button" id="confirm-delete-btn" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 focus-visible:ring-2 focus-visible:ring-red-600 focus-visible:ring-offset-2">確認刪除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 訊息提示 Modal -->
    <div id="alert-modal" class="modal-overlay fixed inset-0 bg-gray-900/60 z-[60] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="alert-modal-title">
        <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-sm overflow-hidden text-center">
            <div class="px-6 py-6">
                <h3 id="alert-modal-title" class="text-lg font-bold text-gray-900 mb-2">系統訊息</h3>
                <p id="alert-message" class="text-gray-700 text-sm mb-5"></p>
                <button type="button" onclick="closeAlertModal()" class="theme-btn w-full px-4 py-2 rounded-md focus-visible:ring-2 focus-visible:ring-offset-2">我知道了</button>
            </div>
        </div>
    </div>

    <script>
        // --- 狀態管理 ---
        const DEFAULT_CATEGORY = '未分類';
        const ALL_CATEGORIES = 'all';

        let data = JSON.parse(localStorage.getItem('wcag_bookmarks_v2')) || {
            categories: [DEFAULT_CATEGORY, '工作', '學習', '娛樂'],
            bookmarks: [],
            currentCategory: ALL_CATEGORIES
        };

        // 確保預設分類存在
        if (!data.categories) data.categories = [DEFAULT_CATEGORY];
        if (!data.bookmarks) data.bookmarks = [];
        if (!data.currentCategory) data.currentCategory = ALL_CATEGORIES;

        let deleteTarget = { type: null, id: null, name: null }; // type: 'bookmark' or 'category'
        let lastFocusedElement = null;

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderBookmarks();
            updateCategoryDropdown();
            setupEventListeners();
        });

        // --- 渲染分類目錄 ---
        function renderCategories() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            
            // "全部" 選項
            const allLi = document.createElement('li');
            const isAllActive = data.currentCategory === ALL_CATEGORIES;
            allLi.innerHTML = `
                <button onclick="selectCategory('${ALL_CATEGORIES}')" 
                    class="category-item w-full text-left px-4 py-2.5 rounded-md flex justify-between items-center transition-colors focus-visible:ring-2 focus-visible:ring-yellow-600 focus:outline-none ${isAllActive ? 'active' : 'text-gray-700'}"
                    aria-current="${isAllActive ? 'page' : 'false'}">
                    <span>全部書籤</span>
                    <span class="text-xs bg-black/10 px-2 py-0.5 rounded-full">${data.bookmarks.length}</span>
                </button>
            `;
            list.appendChild(allLi);

            // 動態分類
            data.categories.forEach(cat => {
                const li = document.createElement('li');
                const isActive = data.currentCategory === cat;
                const count = data.bookmarks.filter(b => b.category === cat).length;
                
                // 保留未分類，但不允許刪除
                const isDeletable = cat !== DEFAULT_CATEGORY;
                const deleteBtnHtml = isDeletable && !isActive ? 
                    `<button onclick="event.stopPropagation(); requestDeleteCategory('${cat}')" class="text-gray-400 hover:text-red-600 p-1 rounded-full focus-visible:ring-2 focus-visible:ring-red-600 focus:outline-none" aria-label="刪除分類 ${cat}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>` : '';

                li.innerHTML = `
                    <button onclick="selectCategory('${cat}')" 
                        class="category-item w-full text-left px-4 py-2.5 rounded-md flex justify-between items-center transition-colors focus-visible:ring-2 focus-visible:ring-yellow-600 focus:outline-none ${isActive ? 'active' : 'text-gray-700'}"
                        aria-current="${isActive ? 'page' : 'false'}">
                        <div class="flex items-center gap-2 truncate">
                            <span class="truncate">${cat}</span>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <span class="text-xs bg-black/10 px-2 py-0.5 rounded-full">${count}</span>
                            ${deleteBtnHtml}
                        </div>
                    </button>
                `;
                list.appendChild(li);
            });

            // 更新 Header 指示器
            const categoryText = data.currentCategory === ALL_CATEGORIES ? '全部書籤' : `分類：${data.currentCategory}`;
            document.getElementById('category-indicator').textContent = categoryText;
            document.getElementById('current-category-title').textContent = categoryText;
        }

        // --- 渲染書籤列表 ---
        function renderBookmarks() {
            const list = document.getElementById('bookmark-list');
            const emptyState = document.getElementById('empty-state');
            
            list.innerHTML = '';
            
            // 過濾書籤
            let filteredBookmarks = data.bookmarks;
            if (data.currentCategory !== ALL_CATEGORIES) {
                filteredBookmarks = data.bookmarks.filter(b => b.category === data.currentCategory);
            }

            if (filteredBookmarks.length === 0) {
                list.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            list.classList.remove('hidden');
            emptyState.classList.add('hidden');

            filteredBookmarks.forEach(bookmark => {
                // 如果書籤的分類已經被刪除，將其歸類為未分類 (防呆)
                const displayCategory = data.categories.includes(bookmark.category) ? bookmark.category : DEFAULT_CATEGORY;

                const li = document.createElement('li');
                li.className = "bg-white rounded-lg shadow-sm border border-yellow-200 hover:shadow-md hover:border-yellow-400 transition-all flex flex-col h-full";
                
                li.innerHTML = `
                    <div class="p-5 flex-grow flex flex-col">
                        <div class="mb-2">
                            <span class="inline-block px-2 py-1 text-xs font-medium bg-yellow-100 text-yellow-800 rounded-md">
                                ${displayCategory}
                            </span>
                        </div>
                        <a href="${bookmark.url}" target="_blank" rel="noopener noreferrer" class="group focus-visible:ring-2 focus-visible:ring-yellow-600 rounded-sm focus:outline-none flex-grow" aria-label="前往 ${bookmark.title}">
                            <h3 class="text-lg font-bold text-gray-900 group-hover:text-yellow-700 transition-colors mb-1 line-clamp-2">${bookmark.title}</h3>
                            <p class="text-sm text-gray-500 truncate mb-4">${bookmark.url}</p>
                        </a>
                        <div class="mt-auto pt-4 border-t border-gray-100 flex justify-end gap-2">
                            <button onclick="editBookmark('${bookmark.id}')" class="px-3 py-1.5 text-sm font-medium text-yellow-800 bg-yellow-50 rounded hover:bg-yellow-100 border border-yellow-200 focus-visible:ring-2 focus-visible:ring-yellow-600 transition-colors" aria-label="修改書籤 ${bookmark.title}">
                                修改
                            </button>
                            <button onclick="requestDeleteBookmark('${bookmark.id}')" class="px-3 py-1.5 text-sm font-medium text-red-700 bg-red-50 rounded hover:bg-red-100 border border-red-100 focus-visible:ring-2 focus-visible:ring-red-600 transition-colors" aria-label="刪除書籤 ${bookmark.title}">
                                刪除
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        // --- 更新表單中的分類選單 ---
        function updateCategoryDropdown() {
            const select = document.getElementById('bookmark-category');
            select.innerHTML = '';
            data.categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                // 如果目前在特定分類下新增，預設選中該分類
                if (data.currentCategory === cat) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        // --- 核心邏輯 ---
        function saveToStorage() {
            localStorage.setItem('wcag_bookmarks_v2', JSON.stringify(data));
            renderCategories();
            renderBookmarks();
            updateCategoryDropdown();
        }

        function selectCategory(category) {
            data.currentCategory = category;
            renderCategories();
            renderBookmarks();
        }

        // --- 處理書籤 CRUD ---
        function handleBookmarkSubmit(e) {
            e.preventDefault();
            const idInput = document.getElementById('bookmark-id').value;
            const titleInput = document.getElementById('bookmark-title').value.trim();
            const urlInput = document.getElementById('bookmark-url').value.trim();
            const categoryInput = document.getElementById('bookmark-category').value;

            let formattedUrl = urlInput;
            if (!/^https?:\/\//i.test(formattedUrl)) {
                formattedUrl = 'https://' + formattedUrl;
            }

            if (idInput) {
                const index = data.bookmarks.findIndex(b => b.id === idInput);
                if (index !== -1) {
                    data.bookmarks[index].title = titleInput;
                    data.bookmarks[index].url = formattedUrl;
                    data.bookmarks[index].category = categoryInput;
                }
            } else {
                data.bookmarks.push({
                    id: Date.now().toString(),
                    title: titleInput,
                    url: formattedUrl,
                    category: categoryInput
                });
            }

            saveToStorage();
            closeFormModal();
            showAlert('書籤已成功儲存！');
        }

        function editBookmark(id) {
            const bookmark = data.bookmarks.find(b => b.id === id);
            if (bookmark) {
                document.getElementById('bookmark-id').value = bookmark.id;
                document.getElementById('bookmark-title').value = bookmark.title;
                document.getElementById('bookmark-url').value = bookmark.url;
                
                updateCategoryDropdown(); // 確保選單是最新的
                const categorySelect = document.getElementById('bookmark-category');
                if (data.categories.includes(bookmark.category)) {
                    categorySelect.value = bookmark.category;
                } else {
                    categorySelect.value = DEFAULT_CATEGORY;
                }

                document.getElementById('form-modal-title').textContent = '修改書籤';
                openFormModal();
            }
        }

        // --- 處理分類 CRUD ---
        function handleCategorySubmit(e) {
            e.preventDefault();
            const nameInput = document.getElementById('new-category-name').value.trim();
            
            if (nameInput === '') return;

            if (data.categories.includes(nameInput)) {
                showAlert('此分類名稱已存在！');
                return;
            }

            data.categories.push(nameInput);
            data.currentCategory = nameInput; // 新增後自動切換過去
            
            saveToStorage();
            closeCategoryModal();
            showAlert('分類已成功新增！');
        }

        // --- 刪除確認邏輯共用 ---
        function requestDeleteBookmark(id) {
            const bookmark = data.bookmarks.find(b => b.id === id);
            deleteTarget = { type: 'bookmark', id: id, name: bookmark.title };
            document.getElementById('confirm-modal-desc').textContent = `確定要刪除書籤「${bookmark.title}」嗎？`;
            openConfirmModal();
        }

        function requestDeleteCategory(categoryName) {
            deleteTarget = { type: 'category', id: categoryName, name: categoryName };
            document.getElementById('confirm-modal-desc').textContent = `確定要刪除分類「${categoryName}」嗎？\n(分類下的書籤將會被移至「未分類」)`;
            openConfirmModal();
        }

        function executeDelete() {
            if (deleteTarget.type === 'bookmark') {
                data.bookmarks = data.bookmarks.filter(b => b.id !== deleteTarget.id);
                showAlert('書籤已成功刪除。');
            } else if (deleteTarget.type === 'category') {
                // 刪除分類，並將該分類下的書籤改為預設分類
                data.categories = data.categories.filter(c => c !== deleteTarget.id);
                data.bookmarks = data.bookmarks.map(b => {
                    if (b.category === deleteTarget.id) b.category = DEFAULT_CATEGORY;
                    return b;
                });
                // 如果當前正在看被刪除的分類，切換回全部
                if (data.currentCategory === deleteTarget.id) {
                    data.currentCategory = ALL_CATEGORIES;
                }
                showAlert('分類已刪除，相關書籤已移至「未分類」。');
            }
            
            saveToStorage();
            deleteTarget = { type: null, id: null, name: null };
            closeConfirmModal();
        }

        // --- 匯入/匯出 ---
        function exportBookmarks() {
            if (data.bookmarks.length === 0 && data.categories.length <= 1) {
                showAlert('目前沒有資料可以匯出。');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `bookmarks_with_categories_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
        }

        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    
                    // 支援舊版 (只有陣列) 或新版格式
                    if (Array.isArray(importedData)) {
                        const validBookmarks = importedData.filter(item => item.id && item.title && item.url).map(item => ({...item, category: DEFAULT_CATEGORY}));
                        data.bookmarks = [...data.bookmarks, ...validBookmarks];
                    } else if (importedData.bookmarks && importedData.categories) {
                        // 合併分類 (去重)
                        data.categories = [...new Set([...data.categories, ...importedData.categories])];
                        // 合併書籤
                        data.bookmarks = [...data.bookmarks, ...importedData.bookmarks];
                    } else {
                        throw new Error('Invalid format');
                    }
                    
                    // 移除重複的 ID 的書籤
                    data.bookmarks = Array.from(new Map(data.bookmarks.map(item => [item.id, item])).values());
                    
                    saveToStorage();
                    showAlert(`成功匯入資料！`);
                } catch (err) {
                    showAlert('匯入失敗：檔案格式不正確。');
                }
            };
            reader.readAsText(file);
            e.target.value = ''; 
        }

        function setupEventListeners() {
            document.getElementById('bookmark-form').addEventListener('submit', handleBookmarkSubmit);
            document.getElementById('category-form').addEventListener('submit', handleCategorySubmit);
            document.getElementById('confirm-delete-btn').addEventListener('click', executeDelete);
            document.getElementById('import-file').addEventListener('change', handleImport);
            
            // ESC 鍵關閉 Modal (無障礙重點)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (document.getElementById('alert-modal').classList.contains('active')) closeAlertModal();
                    else if (document.getElementById('confirm-modal').classList.contains('active')) closeConfirmModal();
                    else if (document.getElementById('form-modal').classList.contains('active')) closeFormModal();
                    else if (document.getElementById('category-modal').classList.contains('active')) closeCategoryModal();
                }
            });
        }

        // --- 無障礙焦點管理 (Trap Focus) ---
        function trapFocus(modalElement) {
            const focusableElements = modalElement.querySelectorAll('a[href], button, textarea, input[type="text"], input[type="url"], input[type="hidden"], input[type="radio"], input[type="checkbox"], select');
            if (focusableElements.length === 0) return;
            
            const firstFocusableElement = focusableElements[0];
            const lastFocusableElement = focusableElements[focusableElements.length - 1];

            const focusHandler = function(e) {
                let isTabPressed = e.key === 'Tab' || e.keyCode === 9;
                if (!isTabPressed) return;

                if (e.shiftKey) { // shift + tab
                    if (document.activeElement === firstFocusableElement) {
                        lastFocusableElement.focus();
                        e.preventDefault();
                    }
                } else { // tab
                    if (document.activeElement === lastFocusableElement) {
                        firstFocusableElement.focus();
                        e.preventDefault();
                    }
                }
            };
            
            modalElement.addEventListener('keydown', focusHandler);
            // 將 handler 存起來以便關閉時移除 (進階實作可考慮，此處簡化處理)
            
            setTimeout(() => {
                const initialFocus = modalElement.querySelector('input[type="text"]:not([type="hidden"])') || firstFocusableElement;
                if(initialFocus) initialFocus.focus();
            }, 100);
        }

        // --- Modal 控制 ---
        function openFormModal() {
            lastFocusedElement = document.activeElement;
            updateCategoryDropdown();
            const modal = document.getElementById('form-modal');
            modal.classList.add('active');
            
            if (!document.getElementById('bookmark-id').value) {
                document.getElementById('bookmark-form').reset();
                document.getElementById('form-modal-title').textContent = '新增書籤';
                // 預設選擇當前分類
                if(data.currentCategory !== ALL_CATEGORIES) {
                    document.getElementById('bookmark-category').value = data.currentCategory;
                }
            }
            trapFocus(modal);
        }

        function closeFormModal() {
            document.getElementById('form-modal').classList.remove('active');
            document.getElementById('bookmark-id').value = '';
            if (lastFocusedElement) lastFocusedElement.focus();
        }

        function openCategoryModal() {
            lastFocusedElement = document.activeElement;
            const modal = document.getElementById('category-modal');
            modal.classList.add('active');
            document.getElementById('category-form').reset();
            trapFocus(modal);
        }

        function closeCategoryModal() {
            document.getElementById('category-modal').classList.remove('active');
            if (lastFocusedElement) lastFocusedElement.focus();
        }

        function openConfirmModal() {
            lastFocusedElement = document.activeElement;
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('active');
            trapFocus(modal);
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('active');
            deleteTarget = { type: null, id: null, name: null };
            if (lastFocusedElement) lastFocusedElement.focus();
        }

        function showAlert(message) {
            lastFocusedElement = document.activeElement;
            const modal = document.getElementById('alert-modal');
            document.getElementById('alert-message').textContent = message;
            modal.classList.add('active');
            trapFocus(modal);
        }

        function closeAlertModal() {
            document.getElementById('alert-modal').classList.remove('active');
            if (lastFocusedElement) lastFocusedElement.focus();
        }
    </script>
</body>
</html>
